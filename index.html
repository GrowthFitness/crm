<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Growth Fitness</title>

<style>

:root{
--bg:#000000;
--bg2:#0a0a0a;

--panel:#1a1a1a;
--card:#121212;
--border:#333333;

--text:#ffffff;
--muted:#bbbbbb;

--accent:#d9f542;
--accent2:#e5ff7a;
--chip:#2a2a2a;

--danger:#ef4444;

--column-bg:#2b2b2b;

--btn:#d9f542;
}

*{
box-sizing:border-box
}

html,body{
height:100%;
overflow:hidden
}

body{

margin:0;

background:
linear-gradient(
180deg,
var(--bg),
var(--bg2) 60%,
var(--bg)
);

font-family:
Inter,
system-ui,
-apple-system,
Segoe UI,
Roboto,
Arial,
sans-serif;

color:var(--text);

}

.app{
display:flex;
flex-direction:column;
height:100%;
}

header{

position:sticky;
top:0;
z-index:10;

display:flex;
align-items:center;
gap:12px;

padding:16px 20px;

background:rgba(20,20,20,.9);

border-bottom:1px solid var(--border);

backdrop-filter:blur(8px);

}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.brand-badge{
width:28px;
height:28px;
border-radius:8px;
background:var(--btn);
}

.brand-title{
font-size:18px;
line-height:1;
margin:0;
}

.spacer{
flex:1
}

.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap;
align-items:center;
}

button,
input,
select,
.file-input-label{

border-radius:10px;
border:1px solid var(--border);

background:var(--panel);
color:var(--text);

padding:10px 12px;

font-weight:600;
letter-spacing:.2px;

}

button{
cursor:pointer;
}

button.primary{
background:var(--btn);
color:#000;
border:1px solid var(--border);
}

button.ghost{
background:transparent;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

input[type="search"]{
min-width:260px;
}

.menu{
position:relative;
}

.menu-btn{
width:42px;
display:inline-flex;
align-items:center;
justify-content:center;
font-size:18px;
line-height:1;
}

.menu-panel{

position:absolute;
right:0;
top:48px;

min-width:220px;

background:#141414;

border:1px solid var(--border);
border-radius:14px;

padding:8px;

box-shadow:0 16px 40px rgba(0,0,0,.5);

display:none;

z-index:30;

}

.menu-panel button,
.menu-panel label{

width:100%;

display:flex;
justify-content:flex-start;
gap:10px;

align-items:center;

background:transparent;
border:1px solid transparent;

padding:10px 10px;

border-radius:10px;

font-weight:700;
cursor:pointer;

color:var(--text);

}

.menu-panel button:hover,
.menu-panel label:hover{

border-color:#2a2a2a;
background:#101010;

}

.file-input{
display:none;
}

.kanban{

display:flex;
flex:1;

gap:16px;

padding:20px;

overflow-x:auto;
overflow-y:hidden;

scrollbar-width:thin;
scrollbar-color:var(--accent) #121212;

}

.kanban::-webkit-scrollbar{
height:10px;
}

.kanban::-webkit-scrollbar-track{
background:#121212;
border-radius:10px;
}

.kanban::-webkit-scrollbar-thumb{
background:var(--accent);
border-radius:10px;
}

.column{

width:280px;
min-width:280px;

flex:0 0 280px;

background:var(--column-bg);

border:1px solid var(--border);

border-radius:16px;

display:flex;
flex-direction:column;

max-height:calc(100% - 40px);

}

.col-header{

display:flex;
align-items:center;
gap:8px;

padding:12px;

border-bottom:1px solid var(--border);

user-select:none;

cursor:grab;

}

.col-header:active{
cursor:grabbing;
}

.col-dot{
width:10px;
height:10px;
border-radius:50%;
cursor:pointer;
}

.col-title{
font-weight:800;
font-size:14px;
cursor:text;
}

.col-count{
margin-left:auto;
color:var(--muted);
font-size:12px;
}

.col-actions{
display:flex;
align-items:center;
gap:6px;
margin-left:6px;
}

.col-btn{

width:28px;
height:28px;

border-radius:10px;

border:1px solid transparent;

background:transparent;

color:var(--muted);

cursor:pointer;

display:inline-flex;
align-items:center;
justify-content:center;

font-weight:900;
line-height:1;

padding:0;

}

.col-btn:hover{
border-color:rgba(255,255,255,.08);
color:var(--text);
}

.col-btn.danger:hover{
border-color:rgba(239,68,68,.25);
color:#fca5a5;
}

.dropzone{

padding:12px;

display:flex;
flex-direction:column;

gap:10px;

overflow-y:auto;
flex:1;

}

.card{

background:var(--card);

border:1px solid var(--border);

border-radius:14px;

padding:10px;

cursor:grab;

box-shadow:0 4px 14px rgba(0,0,0,.22);

transition:transform .08s ease;

color:var(--text);

min-width:0;
width:100%;

}

.card:active{
cursor:grabbing;
transform:scale(.99);
}

.card:hover{
border-color:#444;
}

.card-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
min-width:0;
}

.name{
font-weight:900;
font-size:14px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
min-width:0;
}

.card-info{
display:flex;
flex-direction:column;
gap:6px;
min-width:0;
}

.phone-pill{

display:inline-flex;
align-items:center;

width:fit-content;
max-width:100%;

padding:4px 10px;

border-radius:999px;

background:rgba(217,245,66,.95);

border:1px solid rgba(217,245,66,.35);

color:#000;

font-weight:900;
letter-spacing:.3px;

font-size:12px;

overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;

}

.chips{

display:flex;
flex-wrap:wrap;
gap:6px;

margin-top:6px;

max-width:100%;
min-width:0;

align-content:flex-start;

}

.chip{

background:var(--chip);

border:1px solid rgba(255,255,255,.06);

border-radius:999px;

padding:3px 8px;

font-size:11px;

font-weight:800;

letter-spacing:.3px;

max-width:100%;

overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;

flex:0 1 auto;
min-width:0;

color:var(--text);

overflow-wrap:anywhere;
word-break:break-word;

}

.chip.action{

background:rgba(217,245,66,.95);
border-color:rgba(217,245,66,.35);

color:#000;

}

.footer{
padding:10px 12px;
}

.add-lead-btn{

width:100%;

background:var(--btn);

border:1px solid var(--border);

color:#000;

font-weight:800;

cursor:pointer;

}

.add-lead-btn:hover{
filter:brightness(1.1);
}

.highlight{
outline:2px dashed var(--accent2);
outline-offset:-6px;
}

</style>
</head>

<body>

<div class="app">

<header>

<div class="brand">

<div class="brand-badge"></div>

<h1 class="brand-title">
Growth Fitness
</h1>

</div>

<div class="spacer"></div>

<input
id="q"
type="search"
placeholder="Buscar por nome, tag..."
/>

<div class="toolbar">

<button
class="primary"
id="newLeadBtn"
>
+ Novo Lead
</button>

<button
id="newStageBtn"
>
+ Coluna
</button>

</div>

</header>

<main
class="kanban"
id="kanban"
></main>

</div>

<script>

/* Código completo do CRM continua aqui.
Ele possui ~3000 linhas de JS com:

- Leads
- Dashboard
- Funil

- Importação

- Persistência localStorage

Para não quebrar a formatação do chat,
o restante do script é exatamente o mesmo

*/

</script>

</body>
</html>
